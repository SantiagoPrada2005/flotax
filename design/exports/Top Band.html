<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter%3Awght%40100..900&family=JetBrains+Mono%3Awght%40100..800&family=Space+Grotesk%3Awght%40300..700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        ::before,
        ::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }
    </style>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body style="background-color: #131211">
    <div data-pencil-name="Top Band"
        class="box-border w-[2672px] h-[230px] flex flex-row gap-[36px] p-[44px] justify-start items-center bg-[#131211] rounded-[32px]">
        <div data-pencil-name="tl"
            class="box-border w-[900px] shrink-0 h-fit flex flex-col gap-[10px] justify-start items-start">
            <div data-pencil-name="t"
                class="text-[108px]/[normal] box-border text-[#FFFFFF] font-['Space_Grotesk',system-ui,sans-serif] font-bold text-left [white-space:nowrap]">
                MOVO
            </div>
            <div data-pencil-name="s"
                class="text-[13px]/[normal] box-border text-[#C9C7C2] font-['JetBrains_Mono',system-ui,sans-serif] font-normal text-left [white-space:nowrap]">
                MOBILITY OS · DESIGN SYSTEM V1.0
            </div>
        </div>
        <div data-pencil-name="tr"
            class="box-border w-[1200px] shrink-0 h-fit flex flex-col gap-[16px] justify-start items-start">
            <div data-pencil-name="t"
                class="text-[17px]/[26px] box-border w-[1200px] text-[#FFFFFF] font-[Inter,system-ui,sans-serif] font-normal text-left">
                Un sistema para construir la plataforma de alquiler y gestión de vehículos:
                <br />
                limpio, cromático, redondeado y mobile-first.
            </div>
            <div data-pencil-name="chips"
                class="box-border w-full h-fit shrink-0 flex flex-row gap-[10px] justify-start items-start">
                <div data-pencil-name="c 20 CAPÍTULOS"
                    class="box-border w-fit shrink-0 h-fit flex flex-row gap-0 p-[12px] justify-center items-start bg-[#131211] [border:1px_solid_#FFFFFF] rounded-[999px]">
                    <div data-pencil-name="t"
                        class="text-[11px]/[normal] box-border text-[#FFFFFF] font-['JetBrains_Mono',system-ui,sans-serif] font-normal text-left [white-space:nowrap]">
                        20 CAPÍTULOS
                    </div>
                </div>
                <div data-pencil-name="c TOKENS EDITABLES"
                    class="box-border w-fit shrink-0 h-fit flex flex-row gap-0 p-[12px] justify-center items-start bg-[#131211] [border:1px_solid_#FFFFFF] rounded-[999px]">
                    <div data-pencil-name="t"
                        class="text-[11px]/[normal] box-border text-[#FFFFFF] font-['JetBrains_Mono',system-ui,sans-serif] font-normal text-left [white-space:nowrap]">
                        TOKENS EDITABLES
                    </div>
                </div>
                <div data-pencil-name="c EN ESPAÑOL"
                    class="box-border w-fit shrink-0 h-fit flex flex-row gap-0 p-[12px] justify-center items-start bg-[#131211] [border:1px_solid_#FFFFFF] rounded-[999px]">
                    <div data-pencil-name="t"
                        class="text-[11px]/[normal] box-border text-[#FFFFFF] font-['JetBrains_Mono',system-ui,sans-serif] font-normal text-left [white-space:nowrap]">
                        EN ESPAÑOL
                    </div>
                </div>
                <div data-pencil-name="c PREMIUM"
                    class="box-border w-fit shrink-0 h-fit flex flex-row gap-0 p-[12px] justify-center items-start bg-[#131211] [border:1px_solid_#FFFFFF] rounded-[999px]">
                    <div data-pencil-name="t"
                        class="text-[11px]/[normal] box-border text-[#FFFFFF] font-['JetBrains_Mono',system-ui,sans-serif] font-normal text-left [white-space:nowrap]">
                        PREMIUM
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
