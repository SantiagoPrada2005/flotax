<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter%3Awght%40100..900&family=JetBrains+Mono%3Awght%40100..800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        ::before,
        ::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }
    </style>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div data-pencil-name="Group ESTADO DE LICENCIA — 02"
        class="box-border w-[2554px] h-fit flex flex-col gap-[20px] justify-start items-start">
        <div data-pencil-name="K"
            class="box-border w-full h-fit shrink-0 flex flex-row gap-[10px] justify-start items-center">
            <div data-pencil-name="bar" class="box-border w-[34px] shrink-0 h-[6px] bg-[#131211] rounded-[3px]"></div>
            <div data-pencil-name="lbl"
                class="text-[12px]/[normal] box-border text-[#131211] font-['JetBrains_Mono',system-ui,sans-serif] font-normal tracking-[1.2px] text-left [white-space:nowrap]">
                ESTADO DE LICENCIA — 02
            </div>
        </div>
        <div data-pencil-name="Row"
            class="box-border w-full h-fit shrink-0 flex flex-col gap-[16px] justify-start items-start">
            <div data-pencil-name="R1"
                class="box-border w-full h-fit shrink-0 flex flex-row gap-[16px] justify-start items-start">
                <div data-pencil-name="st Aprobada"
                    class="box-border w-[620px] shrink-0 h-fit flex flex-col gap-[10px] justify-start items-start">
                    <div data-pencil-name="card"
                        class="box-border w-full h-fit shrink-0 flex flex-col gap-[14px] p-[16px] justify-start items-start bg-[#FFFFFF] [border:1px_solid_#E5E4DF] rounded-[20px]">
                        <div data-pencil-name="head"
                            class="box-border w-full h-fit shrink-0 flex flex-row gap-[12px] justify-start items-center">
                            <div data-pencil-name="pill"
                                class="box-border w-fit shrink-0 h-[26px] flex flex-row gap-[6px] p-[10px_8px] justify-center items-center bg-[#12B8861C] rounded-[999px]">
                                <div data-pencil-name="d"
                                    class="box-border w-[8px] shrink-0 h-[8px] bg-[#12B886] rounded-full"></div>
                                <div data-pencil-name="t"
                                    class="text-[11px]/[normal] box-border text-[#12B886] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]">
                                    Aprobada
                                </div>
                            </div>
                            <div data-pencil-name="s"
                                class="text-[10px]/[normal] box-border text-[#A29F99] font-['JetBrains_Mono',system-ui,sans-serif] font-normal text-left [white-space:nowrap]">
                                vigente hasta 2029
                            </div>
                        </div>
                        <div data-pencil-name="doc"
                            class="box-border w-full h-[88px] shrink-0 flex flex-row gap-0 justify-center items-center bg-[#F4F3EF] rounded-[14px]">
                        </div>
                    </div>
                    <div data-pencil-name="cap"
                        class="text-[9.5px]/[normal] box-border text-[#A29F99] font-['JetBrains_Mono',system-ui,sans-serif] font-normal text-left [white-space:nowrap]">
                        LICENSE · APROBADA
                    </div>
                </div>
                <div data-pencil-name="st Pendiente"
                    class="box-border w-[620px] shrink-0 h-fit flex flex-col gap-[10px] justify-start items-start">
                    <div data-pencil-name="card"
                        class="box-border w-full h-fit shrink-0 flex flex-col gap-[14px] p-[16px] justify-start items-start bg-[#FFFFFF] [border:1px_solid_#E5E4DF] rounded-[20px]">
                        <div data-pencil-name="head"
                            class="box-border w-full h-fit shrink-0 flex flex-row gap-[12px] justify-start items-center">
                            <div data-pencil-name="pill"
                                class="box-border w-fit shrink-0 h-[26px] flex flex-row gap-[6px] p-[10px_8px] justify-center items-center bg-[#FFC52E26] rounded-[999px]">
                                <div data-pencil-name="d"
                                    class="box-border w-[8px] shrink-0 h-[8px] bg-[#FFC52E] rounded-full"></div>
                                <div data-pencil-name="t"
                                    class="text-[11px]/[normal] box-border text-[#FFC52E] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]">
                                    Pendiente
                                </div>
                            </div>
                            <div data-pencil-name="s"
                                class="text-[10px]/[normal] box-border text-[#A29F99] font-['JetBrains_Mono',system-ui,sans-serif] font-normal text-left [white-space:nowrap]">
                                revisión en curso
                            </div>
                        </div>
                        <div data-pencil-name="doc"
                            class="box-border w-full h-[88px] shrink-0 flex flex-row gap-0 justify-center items-center bg-[#F4F3EF] rounded-[14px]">
                        </div>
                    </div>
                    <div data-pencil-name="cap"
                        class="text-[9.5px]/[normal] box-border text-[#A29F99] font-['JetBrains_Mono',system-ui,sans-serif] font-normal text-left [white-space:nowrap]">
                        LICENSE · PENDIENTE
                    </div>
                </div>
                <div data-pencil-name="st No realizada"
                    class="box-border w-[620px] shrink-0 h-fit flex flex-col gap-[10px] justify-start items-start">
                    <div data-pencil-name="card"
                        class="box-border w-full h-fit shrink-0 flex flex-col gap-[14px] p-[16px] justify-start items-start bg-[#FFFFFF] [border:1px_solid_#E5E4DF] rounded-[20px]">
                        <div data-pencil-name="head"
                            class="box-border w-full h-fit shrink-0 flex flex-row gap-[12px] justify-start items-center">
                            <div data-pencil-name="pill"
                                class="box-border w-fit shrink-0 h-[26px] flex flex-row gap-[6px] p-[10px_8px] justify-center items-center bg-[#ECEBE6] rounded-[999px]">
                                <div data-pencil-name="d"
                                    class="box-border w-[8px] shrink-0 h-[8px] bg-[#A29F99] rounded-full"></div>
                                <div data-pencil-name="t"
                                    class="text-[11px]/[normal] box-border text-[#A29F99] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]">
                                    No realizada
                                </div>
                            </div>
                            <div data-pencil-name="s"
                                class="text-[10px]/[normal] box-border text-[#A29F99] font-['JetBrains_Mono',system-ui,sans-serif] font-normal text-left [white-space:nowrap]">
                                sin documento cargado
                            </div>
                        </div>
                        <div data-pencil-name="doc"
                            class="box-border w-full h-[88px] shrink-0 flex flex-row gap-0 justify-center items-center bg-[#F4F3EF] rounded-[14px]">
                        </div>
                    </div>
                    <div data-pencil-name="cap"
                        class="text-[9.5px]/[normal] box-border text-[#A29F99] font-['JetBrains_Mono',system-ui,sans-serif] font-normal text-left [white-space:nowrap]">
                        LICENSE · NO REALIZADA
                    </div>
                </div>
                <div data-pencil-name="st No vigente"
                    class="box-border w-[620px] shrink-0 h-fit flex flex-col gap-[10px] justify-start items-start">
                    <div data-pencil-name="card"
                        class="box-border w-full h-fit shrink-0 flex flex-col gap-[14px] p-[16px] justify-start items-start bg-[#FFFFFF] [border:1px_solid_#E5E4DF] rounded-[20px]">
                        <div data-pencil-name="head"
                            class="box-border w-full h-fit shrink-0 flex flex-row gap-[12px] justify-start items-center">
                            <div data-pencil-name="pill"
                                class="box-border w-fit shrink-0 h-[26px] flex flex-row gap-[6px] p-[10px_8px] justify-center items-center bg-[#F43F471C] rounded-[999px]">
                                <div data-pencil-name="d"
                                    class="box-border w-[8px] shrink-0 h-[8px] bg-[#F43F47] rounded-full"></div>
                                <div data-pencil-name="t"
                                    class="text-[11px]/[normal] box-border text-[#F43F47] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]">
                                    No vigente
                                </div>
                            </div>
                            <div data-pencil-name="s"
                                class="text-[10px]/[normal] box-border text-[#A29F99] font-['JetBrains_Mono',system-ui,sans-serif] font-normal text-left [white-space:nowrap]">
                                vencida · renovar
                            </div>
                        </div>
                        <div data-pencil-name="doc"
                            class="box-border w-full h-[88px] shrink-0 flex flex-row gap-0 justify-center items-center bg-[#F4F3EF] rounded-[14px]">
                        </div>
                    </div>
                    <div data-pencil-name="cap"
                        class="text-[9.5px]/[normal] box-border text-[#A29F99] font-['JetBrains_Mono',system-ui,sans-serif] font-normal text-left [white-space:nowrap]">
                        LICENSE · NO VIGENTE
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
