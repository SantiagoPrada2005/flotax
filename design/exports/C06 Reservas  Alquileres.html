<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter%3Awght%40100..900&family=JetBrains+Mono%3Awght%40100..800&family=Space+Grotesk%3Awght%40300..700&display=swap"
        rel="stylesheet" />
    <style>
        *,
        ::before,
        ::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }
    </style>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div data-pencil-name="C06 Reservas &amp; Alquileres"
        class="box-border w-[2672px] h-fit flex flex-col gap-[32px] justify-start items-start">
        <div data-pencil-name="Header 06"
            class="box-border w-full h-fit shrink-0 flex flex-col gap-0 justify-start items-start bg-[#FFFFFF]">
            <div data-pencil-name="Header Row"
                class="box-border w-full h-fit shrink-0 flex flex-row gap-[28px] justify-start items-center">
                <div data-pencil-name="NumChip"
                    class="box-border w-[72px] shrink-0 h-[72px] flex flex-row gap-0 justify-center items-center bg-[#131211] rounded-[20px]">
                    <div data-pencil-name="Num"
                        class="text-[26px]/[normal] box-border text-[#FFFFFF] font-['Space_Grotesk',system-ui,sans-serif] font-bold text-left [white-space:nowrap]">
                        06
                    </div>
                </div>
                <div data-pencil-name="TitleCol"
                    class="box-border [flex:1_1_0] h-fit flex flex-col gap-[6px] justify-start items-start">
                    <div data-pencil-name="Title"
                        class="text-[38px]/[normal] box-border text-[#131211] font-['Space_Grotesk',system-ui,sans-serif] font-bold text-left [white-space:nowrap]">
                        Reservas &amp; Alquileres
                    </div>
                    <div data-pencil-name="Sub"
                        class="text-[15px]/[normal] box-border text-[#6E6C66] font-[Inter,system-ui,sans-serif] font-normal text-left [white-space:nowrap]">
                        Tarjetas, estados y resúmenes de fechas y precios
                    </div>
                </div>
                <div data-pencil-name="Meta"
                    class="text-[13px]/[normal] box-border text-[#A29F99] font-['JetBrains_Mono',system-ui,sans-serif] font-normal text-left [white-space:nowrap]">
                    RESERVATION · RENTAL · STATUS · PRICING
                </div>
            </div>
            <div data-pencil-name="Rule" class="box-border w-full h-[2px] shrink-0 bg-[#131211]"></div>
        </div>
    </div>
</body>

</html>
