<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        tailwind = { config: { corePlugins: { preflight: false } } };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Geist+Mono%3Awght%40100..900&family=Inter%3Awght%40100..900&display=swap"
        rel="stylesheet" />
    <style>
        *,
        ::before,
        ::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
        }
    </style>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div data-pencil-name="Claves móviles"
        class="box-border w-[1632px] h-fit flex flex-row gap-[20px] justify-start items-start">
        <div data-pencil-name="Tile 44 px"
            class="box-border [flex:1_1_0] h-[150px] flex flex-col gap-[6px] p-[20px] justify-center items-start [outline:1px_solid_#E5E4DF] [outline-offset:-0.5px] rounded-[20px]">
            <div data-pencil-name="k"
                class="text-[26px]/[normal] box-border text-[#131211] font-['Geist_Mono',system-ui,sans-serif] font-semibold text-left [white-space:nowrap]">
                44 px
            </div>
            <div data-pencil-name="t"
                class="text-[13px]/[normal] box-border text-[#131211] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]">
                Touch targets
            </div>
            <div data-pencil-name="d"
                class="text-[11px]/[15px] box-border w-full text-[#6E6C66] font-[Inter,system-ui,sans-serif] font-normal text-left">
                Área táctil mínima en toda la interfaz.
            </div>
        </div>
        <div data-pencil-name="Tile 64 px"
            class="box-border [flex:1_1_0] h-[150px] flex flex-col gap-[6px] p-[20px] justify-center items-start [outline:1px_solid_#E5E4DF] [outline-offset:-0.5px] rounded-[20px]">
            <div data-pencil-name="k"
                class="text-[26px]/[normal] box-border text-[#131211] font-['Geist_Mono',system-ui,sans-serif] font-semibold text-left [white-space:nowrap]">
                64 px
            </div>
            <div data-pencil-name="t"
                class="text-[13px]/[normal] box-border text-[#131211] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]">
                Bottom nav
            </div>
            <div data-pencil-name="d"
                class="text-[11px]/[15px] box-border w-full text-[#6E6C66] font-[Inter,system-ui,sans-serif] font-normal text-left">
                Barra inferior cómoda con FAB de 56 px.
            </div>
        </div>
        <div data-pencil-name="Tile 56 px"
            class="box-border [flex:1_1_0] h-[150px] flex flex-col gap-[6px] p-[20px] justify-center items-start [outline:1px_solid_#E5E4DF] [outline-offset:-0.5px] rounded-[20px]">
            <div data-pencil-name="k"
                class="text-[26px]/[normal] box-border text-[#131211] font-['Geist_Mono',system-ui,sans-serif] font-semibold text-left [white-space:nowrap]">
                56 px
            </div>
            <div data-pencil-name="t"
                class="text-[13px]/[normal] box-border text-[#131211] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]">
                FAB principal
            </div>
            <div data-pencil-name="d"
                class="text-[11px]/[15px] box-border w-full text-[#6E6C66] font-[Inter,system-ui,sans-serif] font-normal text-left">
                Acción dominante: nueva reserva.
            </div>
        </div>
        <div data-pencil-name="Tile 8–12 px"
            class="box-border [flex:1_1_0] h-[150px] flex flex-col gap-[6px] p-[20px] justify-center items-start [outline:1px_solid_#E5E4DF] [outline-offset:-0.5px] rounded-[20px]">
            <div data-pencil-name="k"
                class="text-[26px]/[normal] box-border text-[#131211] font-['Geist_Mono',system-ui,sans-serif] font-semibold text-left [white-space:nowrap]">
                8–12 px
            </div>
            <div data-pencil-name="t"
                class="text-[13px]/[normal] box-border text-[#131211] font-[Inter,system-ui,sans-serif] font-semibold text-left [white-space:nowrap]">
                Gaps móviles
            </div>
            <div data-pencil-name="d"
                class="text-[11px]/[15px] box-border w-full text-[#6E6C66] font-[Inter,system-ui,sans-serif] font-normal text-left">
                Espaciado compacto entre bloques.
            </div>
        </div>
    </div>
</body>

</html>
