<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <linearGradient id="id-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="gold-chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Pure White Canvas -->
  <rect width="400" height="250" fill="#FFFFFF" />

  <!-- Horizontal Landscape ID Card Peeking from Bottom -->
  <g filter="url(#card-shadow)">
    <!-- Card Base (Horizontal 300x190) -->
    <rect x="50" y="70" width="300" height="190" rx="16" fill="url(#id-grad)" stroke="#374151" stroke-width="1.2" />

    <!-- Subtle Holographic/Guilloche Curve Patterns -->
    <path d="M 50 130 C 130 90, 220 160, 350 110" fill="none" stroke="#4B5563" stroke-width="0.75" stroke-opacity="0.4" />
    <path d="M 50 145 C 140 105, 230 175, 350 125" fill="none" stroke="#4B5563" stroke-width="0.75" stroke-opacity="0.3" />
    <path d="M 50 160 C 150 120, 240 190, 350 140" fill="none" stroke="#4B5563" stroke-width="0.75" stroke-opacity="0.2" />

    <!-- Top Document Header -->
    <text x="70" y="93" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2">DOCUMENTO DE IDENTIDAD</text>
    <circle cx="320" cy="90" r="3" fill="#10B981" />
    <circle cx="320" cy="90" r="6" fill="#10B981" fill-opacity="0.2" />

    <!-- Left: ID Portrait Photo Box -->
    <rect x="70" y="105" width="56" height="70" rx="8" fill="#111827" stroke="#4B5563" stroke-width="1" />
    <!-- Avatar Silhouette -->
    <circle cx="98" cy="128" r="11" fill="#4B5563" />
    <path d="M 78 165 C 78 147, 118 147, 118 165 Z" fill="#4B5563" />

    <!-- Center/Right: Identification Details -->
    <text x="140" y="116" fill="#6B7280" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.8">NÚMERO DE IDENTIFICACIÓN</text>
    <text x="140" y="130" fill="#EDEDED" font-family="monospace" font-size="12" font-weight="700" letter-spacing="1.5">ID 1.094.820.591</text>

    <!-- Biometric Chip Symbol -->
    <rect x="294" y="112" width="26" height="20" rx="3" fill="url(#gold-chip)" opacity="0.9" />
    <path d="M 294 122 L 320 122 M 307 112 L 307 132" stroke="#B45309" stroke-width="0.7" />

    <!-- Name and Nationality Data Lines -->
    <text x="140" y="148" fill="#6B7280" font-family="system-ui, sans-serif" font-size="7" font-weight="600" letter-spacing="0.5">TITULAR / NACIONALIDAD</text>
    <text x="140" y="161" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="9" font-weight="600">CIUDADANO VERIFICADO</text>

    <!-- Fingerprint / Microchip Icon Accent -->
    <g transform="translate(296, 144)" stroke="#6B7280" stroke-width="1" fill="none" opacity="0.7">
      <path d="M 5 0 A 7 7 0 0 1 17 0" />
      <path d="M 2 4 A 10 10 0 0 1 20 4" />
      <path d="M 6 8 A 6 6 0 0 1 16 8" />
      <path d="M 9 12 A 2 2 0 0 1 13 12" />
    </g>
  </g>
</svg>
