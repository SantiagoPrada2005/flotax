<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <filter id="pay-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="gold-chip-pay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Pure White Canvas -->
  <rect width="400" height="250" fill="#FFFFFF" />

  <!-- Horizontal Landscape Payment Card Peeking from Bottom -->
  <g filter="url(#pay-shadow)">
    <!-- Card Base (Horizontal 300x190) -->
    <rect x="50" y="70" width="300" height="190" rx="16" fill="url(#card-grad)" stroke="#374151" stroke-width="1.2" />

    <!-- Top Payment Header -->
    <text x="70" y="93" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2">PAGO &amp; GARANTÍA</text>

    <!-- Contactless Waves Symbol in Top Right -->
    <g transform="translate(312, 83)" stroke="#EDEDED" stroke-width="1.3" fill="none">
      <path d="M 0 10 A 10 10 0 0 1 0 0" />
      <path d="M 4 12 A 14 14 0 0 1 4 -2" />
      <path d="M 8 14 A 18 18 0 0 1 8 -4" />
    </g>

    <!-- Metallic Gold EMV Chip -->
    <rect x="70" y="108" width="36" height="28" rx="4" fill="url(#gold-chip-pay)" />
    <path d="M 70 122 L 106 122 M 88 108 L 88 136 M 78 108 L 78 136 M 98 108 L 98 136" stroke="#92400E" stroke-width="0.8" opacity="0.8" />

    <!-- Embossed Card Numbers -->
    <g fill="#EDEDED" opacity="0.85" font-family="monospace" font-size="12" font-weight="700" letter-spacing="2">
      <text x="70" y="158">••••  ••••  ••••  8492</text>
    </g>

    <!-- Accepted Badges Text -->
    <text x="70" y="178" fill="#6B7280" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.5">DÉBITO • CRÉDITO • TRANSFERENCIA</text>
  </g>
</svg>
