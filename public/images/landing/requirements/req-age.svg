<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <filter id="age-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <linearGradient id="age-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="badge-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
  </defs>

  <!-- Pure White Canvas -->
  <rect width="400" height="250" fill="#FFFFFF" />

  <!-- Horizontal Landscape Age Card Peeking from Bottom -->
  <g filter="url(#age-shadow)">
    <!-- Card Base (Horizontal 300x190) -->
    <rect x="50" y="70" width="300" height="190" rx="16" fill="url(#age-grad)" stroke="#374151" stroke-width="1.2" />

    <!-- Top Age Header -->
    <text x="200" y="93" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2" text-anchor="middle">VERIFICACIÓN DE EDAD</text>

    <!-- Concentric Decorative Circles -->
    <circle cx="200" cy="142" r="48" fill="none" stroke="#374151" stroke-width="1" stroke-dasharray="3,3" opacity="0.6" />
    <circle cx="200" cy="142" r="40" fill="none" stroke="#4B5563" stroke-width="1.2" opacity="0.5" />

    <!-- Prominent 21+ Gold Embossed Circular Badge -->
    <circle cx="200" cy="142" r="32" fill="#111827" stroke="url(#badge-gold)" stroke-width="2" />
    <circle cx="200" cy="142" r="28" fill="none" stroke="url(#badge-gold)" stroke-width="0.8" opacity="0.6" />
    <text x="200" y="150" fill="url(#badge-gold)" font-family="system-ui, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="-0.5">21+</text>

    <!-- Sub-status -->
    <text x="200" y="185" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle" letter-spacing="1">AUTOS &amp; SUVS • (+18 MOTOS)</text>
  </g>
</svg>
