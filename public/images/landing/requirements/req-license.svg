<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <filter id="license-shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.12" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
    <linearGradient id="lic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <!-- Pure White Canvas -->
  <rect width="400" height="250" fill="#FFFFFF" />

  <!-- Horizontal Landscape Driver's License Peeking from Bottom -->
  <g filter="url(#license-shadow)">
    <!-- Card Base (Horizontal 300x190) -->
    <rect x="50" y="70" width="300" height="190" rx="16" fill="url(#lic-grad)" stroke="#374151" stroke-width="1.2" />

    <!-- Top License Header -->
    <text x="70" y="93" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2">LICENCIA DE CONDUCCIÓN</text>
    
    <!-- Steering Wheel Emblem in Top Right -->
    <g transform="translate(305, 80)" stroke="#9CA3AF" stroke-width="1.2" fill="none">
      <circle cx="10" cy="10" r="8" />
      <circle cx="10" cy="10" r="2.5" fill="#9CA3AF" />
      <line x1="10" y1="2" x2="10" y2="7.5" />
      <line x1="3" y1="14" x2="8" y2="11.5" />
      <line x1="17" y1="14" x2="12" y2="11.5" />
    </g>

    <!-- Left: Driver Portrait Photo Box -->
    <rect x="70" y="105" width="56" height="70" rx="8" fill="#111827" stroke="#4B5563" stroke-width="1" />
    <circle cx="98" cy="128" r="11" fill="#4B5563" />
    <path d="M 78 165 C 78 147, 118 147, 118 165 Z" fill="#4B5563" />

    <!-- Center/Right: Category Badges & Details -->
    <text x="140" y="116" fill="#6B7280" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" letter-spacing="0.8">CATEGORÍAS AUTORIZADAS</text>
    
    <!-- Category Pills -->
    <g transform="translate(140, 122)">
      <rect x="0" y="0" width="32" height="18" rx="4" fill="#374151" />
      <text x="16" y="12.5" fill="#EDEDED" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">A2</text>

      <rect x="38" y="0" width="32" height="18" rx="4" fill="#374151" />
      <text x="54" y="12.5" fill="#EDEDED" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">B1</text>

      <rect x="76" y="0" width="32" height="18" rx="4" fill="#374151" />
      <text x="92" y="12.5" fill="#EDEDED" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">C1</text>
    </g>

    <!-- Validity and Security Status -->
    <text x="140" y="156" fill="#6B7280" font-family="system-ui, sans-serif" font-size="7" font-weight="600" letter-spacing="0.5">ESTADO / VIGENCIA</text>
    <g transform="translate(140, 162)">
      <circle cx="4" cy="4" r="3" fill="#10B981" />
      <text x="12" y="7" fill="#D1D5DB" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600">HABILITADA PARA CONDUCIR</text>
    </g>
  </g>
</svg>
