<!DOCTYPE html>

    }

      color: #EDEDED;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 6px 12px;

    }

</head>
<body>

  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#111827',
        primaryColor: '#1F2937',
        primaryTextColor: '#EDEDED',
        primaryBorderColor: '#4B5563',
        lineColor: '#9CA3AF',
        secondaryColor: '#374151',
        tertiaryColor: '#111827',
        attributeBackgroundColorOdd: '#1F2937',
        attributeBackgroundColorEven: '#111827'
      },
      er: {
        useMaxWidth: false
      }
    });

    let panZoomInstance = null;

    async function renderDiagram() {
      const source = document.getElementById('mmd-source').textContent.trim();
      const container = document.getElementById('container');
      const loader = document.getElementById('loading-indicator');

      try {
        const { svg } = await mermaid.render('mermaid-svg', source);
        container.innerHTML = svg;
        loader.style.display = 'none';
        container.style.display = 'block';

        const svgElement = container.querySelector('svg');
        svgElement.style.width = '100%';
        svgElement.style.height = '100%';

        panZoomInstance = svgPanZoom(svgElement, {
          zoomEnabled: true,
          controlIconsEnabled: false,
          fit: true,
          center: true,
          minZoom: 0.1,
          maxZoom: 15,
          zoomScaleSensitivity: 0.25
        });

        // Controles de zoom
        document.getElementById('btn-zoom-in').onclick = () => panZoomInstance.zoomIn();
        document.getElementById('btn-zoom-out').onclick = () => panZoomInstance.zoomOut();
        document.getElementById('btn-reset').onclick = () => {
          panZoomInstance.reset();
          panZoomInstance.fit();
          panZoomInstance.center();
        };

        // Descarga de SVG
        document.getElementById('btn-download').onclick = () => {
          const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'flotax-database-er.svg';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        };
      } catch (err) {
        loader.innerHTML = '<p style="color: #ef4444;">Error al renderizar el diagrama: ' + err.message + '</p>';
      }
    }

    window.addEventListener('DOMContentLoaded', renderDiagram);
  </script>
